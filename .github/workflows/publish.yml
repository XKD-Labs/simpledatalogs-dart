name: Publish to pub.dev

# pub.dev trusts these tags through OIDC, set up under "Automated publishing" on each package's admin page.
# Repository XKD-Labs/simpledatalogs-dart; tag patterns v{{version}} (core) and flutter-v{{version}} (Flutter).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
      - "flutter-v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  # The core, through Dart's own reusable publishing workflow.
  core:
    if: startsWith(github.ref_name, 'v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      environment: pub.dev

  # The Flutter companion, published with the Flutter SDK and the same OIDC token.
  flutter:
    if: startsWith(github.ref_name, 'flutter-v')
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.6"
          channel: stable

      # Publish against the released core on pub.dev, not the path override.
      - run: rm pubspec_overrides.yaml
      - run: flutter pub get
      - run: flutter test
      - run: flutter pub publish --force
