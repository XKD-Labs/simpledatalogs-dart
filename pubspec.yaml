name: simpledatalogs
description: Track events and logs from Dart and Flutter apps and servers with simpledatalogs. A crash-safe outbox, batching, retries with backoff, and no lost or double-counted events.
version: 0.1.0
homepage: https://simpledatalogs.com
repository: https://github.com/XKD-Labs/simpledatalogs-dart
issue_tracker: https://github.com/XKD-Labs/simpledatalogs-dart/issues
documentation: https://simpledatalogs.com/docs
topics:
  - analytics
  - logging
  - events
  - telemetry

environment:
  sdk: ^3.5.0

dependencies:
  http: ^1.2.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
