include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - avoid_print
    - curly_braces_in_flow_control_structures
    - prefer_final_locals
    - public_member_api_docs
    - unawaited_futures

formatter:
  page_width: 140
